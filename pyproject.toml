[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kasauti"
version = "0.1.0"
description = "Kasauti (कसौटी) — the touchstone for WhatsApp forwards. An evidence-first misinformation checker for India, powered by SerpApi."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Saud Satopay" }]
keywords = [
    "fact-checking",
    "misinformation",
    "serpapi",
    "india",
    "whatsapp",
    "news-literacy",
    "ai-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "serpapi>=0.1.5",
    "pydantic>=2.5",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-dotenv>=1.0",
    "openai>=1.30",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
kasauti = "kasauti.cli:main"

[project.urls]
Homepage = "https://github.com/SaudSatopay/kasauti"
Documentation = "https://github.com/SaudSatopay/kasauti#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/kasauti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
